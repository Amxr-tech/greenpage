[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenpage"
dynamic = ["version"]
description = "Estimate and budget the carbon footprint of web pages, locally or in CI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "greenpage contributors" }]
keywords = ["sustainability", "carbon", "green-software", "web-performance", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
greenpage = "greenpage.cli:main"

[tool.hatch.version]
path = "src/greenpage/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
